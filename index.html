<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Misión 1 · Los invisibles</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%94%AC%3C/text%3E%3C/svg%3E">
<meta name="description" content="Biología 1.º Bachillerato · Tema 4 · Microorganismos: app de estudio complementaria.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1E2D; --bg2:#123A52; --panel:#16344A; --panel2:#1C4560;
  --ink:#EAF4F6; --muted:#A9C3CC; --paper:#F4F8F7; --paperInk:#14232C;
  --tq:#2EC4B6; --green:#8BC34A; --gold:#F2B134; --silver:#B8C4CC;
  --red:#D64550; --wine:#8E1B2C; --ok:#3DDC97; --bad:#FF6B6B;
  --r:18px; --sh:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#0B1E2D}
html,body{margin:0;min-height:100%}
body{font-family:'Outfit',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:18px;line-height:1.5;color:var(--ink);
  background:radial-gradient(1200px 800px at 70% -10%,#1d5a78 0%,transparent 60%),linear-gradient(180deg,var(--bg2),var(--bg));background-attachment:fixed;min-height:100%}
i{font-style:italic}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.btn{min-height:48px;min-width:48px;padding:10px 18px;border-radius:14px;background:var(--panel2);color:var(--ink);font-weight:600;font-size:17px;
  border:2px solid rgba(255,255,255,.12);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,background .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--tq);color:#06232A;border-color:transparent}
.btn.gold{background:var(--gold);color:#2A1C00;border-color:transparent}
.btn.ghost{background:transparent}
.btn.small{min-height:44px;padding:6px 14px;font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.tile:focus-visible,.chip:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* Barra superior */
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:rgba(11,30,45,.92);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.08)}
#top .home{font-size:22px}
#top .ttl{font-weight:700;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpbox{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
.xpbar{width:110px;height:12px;border-radius:8px;background:#0a1621;overflow:hidden;border:1px solid rgba(255,255,255,.15)}
.xpbar>span{display:block;height:100%;background:linear-gradient(90deg,var(--tq),var(--green));transition:width .5s}
#main{max-width:1100px;margin:0 auto;padding:16px 16px 120px}
h1{font-size:30px;line-height:1.15;margin:8px 0 6px}
h2{font-size:24px;margin:18px 0 8px}
h3{font-size:20px;margin:12px 0 6px}
.sub{color:var(--muted)}
.ref{font-size:14px;color:var(--muted);opacity:.9}
.paper .ref{color:#4d6470}
.panel{background:rgba(22,52,74,.85);border:1px solid rgba(255,255,255,.1);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.paper{background:var(--paper);color:var(--paperInk);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}
.mt{margin-top:14px}
.center{text-align:center}
.hide{display:none!important}

/* Portada */
.hero{position:relative;border-radius:24px;overflow:hidden;min-height:260px;box-shadow:var(--sh)}
.hero img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.hero .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,18,28,.92) 0%,rgba(6,18,28,.55) 55%,rgba(6,18,28,.1) 100%)}
.hero .in{position:relative;padding:28px;max-width:560px}
.kicker{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--tq);font-weight:700}
.map{position:relative;margin-top:18px;border-radius:24px;overflow:hidden;padding:18px;background:#0e2a3b}
.map .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.map .nodes{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.tile{position:relative;text-align:left;padding:16px;border-radius:18px;background:rgba(11,30,45,.82);border:2px solid rgba(255,255,255,.12);min-height:110px;display:flex;flex-direction:column;gap:4px}
.tile .ic{font-size:30px}
.tile .nm{font-weight:700;font-size:19px}
.tile .ds{font-size:15px;color:var(--muted)}
.tile.done{border-color:var(--ok)}
.tile.done::after{content:'✓ Completado';position:absolute;top:10px;right:12px;font-size:13px;font-weight:700;color:var(--ok)}
.tile.locked{opacity:.55}
.tile.locked::after{content:'🔒 Bloqueado';position:absolute;top:10px;right:12px;font-size:13px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{padding:12px;border-radius:14px;background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.2);text-align:center;font-size:15px}
.badge .bi{font-size:30px;filter:grayscale(1);opacity:.4}
.badge.on{border:2px solid var(--gold);background:rgba(242,177,52,.12)}
.badge.on .bi{filter:none;opacity:1}

/* Audio y subtítulos */
.listen{background:#0a1621;border:2px solid var(--tq);color:var(--tq)}
.listen.on{background:var(--tq);color:#06232A}
#subs{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);max-width:min(900px,92vw);background:rgba(0,0,0,.88);color:#fff;padding:12px 18px;border-radius:14px;font-size:19px;z-index:50;border:2px solid var(--tq)}

/* Cápsula */
.stage{position:relative;border-radius:20px;overflow:hidden;background:#06131c;aspect-ratio:16/9;width:min(100%, calc(62vh * 16 / 9));margin:0 auto}
.stage>img,.stage>svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 18px;background:linear-gradient(0deg,rgba(0,0,0,.85),rgba(0,0,0,0));font-size:19px}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0}
.dots span{width:12px;height:12px;border-radius:50%;background:#33505f}
.dots span.on{background:var(--tq)}
.stop{border-left:6px solid var(--gold)}
.opt{display:block;width:100%;text-align:left;min-height:52px;padding:12px 16px;margin:8px 0;border-radius:14px;background:var(--panel2);border:2px solid rgba(255,255,255,.14);font-size:17px}
.paper .opt{background:#fff;border-color:#c9d6dc;color:var(--paperInk)}
.opt.good{border-color:var(--ok);background:rgba(61,220,151,.18)}
.opt.badx{border-color:var(--bad);background:rgba(255,107,107,.16)}
.opt .why{display:block;font-size:15px;margin-top:4px;opacity:.95}
.mark{font-weight:800;margin-right:6px}

/* Cartas */
.deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{perspective:1200px;height:330px;cursor:pointer}
.card .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;display:flex;flex-direction:column}
.front{background:linear-gradient(160deg,#173f57,#0c2433);border:4px solid var(--silver)}
.card.r-r .front{border-color:var(--tq)}
.card.r-e .front{border-color:var(--gold);box-shadow:0 0 0 2px rgba(242,177,52,.35),0 0 24px rgba(242,177,52,.35)}
.front .art{flex:1;min-height:0;background:#0a1b26;display:flex;align-items:center;justify-content:center;overflow:hidden}
.front .art img{width:100%;height:100%;object-fit:cover}
.front .art svg{width:80%;height:80%}
.front .meta{padding:10px 12px;background:rgba(0,0,0,.35)}
.front .nm{font-weight:700;font-size:18px;line-height:1.2}
.front .tp{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-top:4px}
.back{transform:rotateY(180deg);background:var(--paper);color:var(--paperInk);padding:12px 14px;font-size:15.5px;overflow:auto;border:4px solid var(--silver)}
.card.r-r .back{border-color:var(--tq)}.card.r-e .back{border-color:var(--gold)}
.back h4{margin:0 0 6px;font-size:17px}
.back p{margin:4px 0}
.nc{background:#ffe9e9;border-left:5px solid var(--red);padding:6px 8px;border-radius:8px;margin:6px 0}
.rar{font-weight:700}
.failtag{position:absolute;top:8px;left:8px;background:var(--red);color:#fff;font-size:13px;padding:2px 8px;border-radius:10px;z-index:2}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.tabs .btn[aria-pressed=true]{background:var(--tq);color:#06232A}
.mem{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.mtile{min-height:120px;border-radius:14px;padding:10px;background:var(--panel2);border:2px solid rgba(255,255,255,.15);font-size:15px;text-align:left}
.mtile.hidden{background:repeating-linear-gradient(45deg,#163a50,#163a50 10px,#1a4560 10px,#1a4560 20px);color:transparent}
.mtile.hidden *{visibility:hidden}
.mtile.sel{border-color:var(--gold)}
.mtile.ok{border-color:var(--ok);background:rgba(61,220,151,.14)}

/* Arrastre */
.chips{display:flex;flex-wrap:wrap;gap:10px;min-height:56px}
.chip{touch-action:none;user-select:none;-webkit-user-select:none;min-height:48px;padding:10px 14px;border-radius:12px;background:#fff;color:var(--paperInk);font-weight:600;font-size:16px;border:2px solid #9fb4bf;box-shadow:0 3px 0 rgba(0,0,0,.25);cursor:grab;display:inline-flex;align-items:center;gap:8px;max-width:100%}
.chip img{width:56px;height:56px;object-fit:cover;border-radius:8px}
.chip.sel{outline:3px solid var(--gold)}
.chip.ok{border-color:var(--ok);background:#e4fbef}
.chip.no{border-color:var(--bad);background:#ffe6e6}
.chip.dragging{opacity:.9;box-shadow:0 12px 24px rgba(0,0,0,.4);z-index:100;position:fixed;pointer-events:none}
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.zone{min-height:120px;border-radius:16px;border:3px dashed rgba(255,255,255,.3);padding:10px;background:rgba(255,255,255,.04)}
.zone.over{border-color:var(--gold);background:rgba(242,177,52,.12)}
.zone h4{margin:0 0 8px;font-size:17px}
.slot{min-height:52px;border-radius:12px;border:2px dashed rgba(255,255,255,.35);display:flex;align-items:center;gap:8px;padding:4px 8px;margin:6px 0;background:rgba(255,255,255,.04)}
.slot .num{font-weight:800;color:var(--gold);min-width:26px}
.slot.over{border-color:var(--gold)}
.feedback{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:17px}
.feedback.good{background:rgba(61,220,151,.15);border:2px solid var(--ok)}
.feedback.bad{background:rgba(255,107,107,.14);border:2px solid var(--bad)}

/* Mito o ciencia */
.swipewrap{position:relative;height:300px;max-width:520px;margin:0 auto}
.swcard{position:absolute;inset:0;border-radius:22px;background:var(--paper);color:var(--paperInk);padding:26px;font-size:22px;font-weight:600;display:flex;align-items:center;justify-content:center;text-align:center;touch-action:none;box-shadow:var(--sh);user-select:none;-webkit-user-select:none}
.swcard .lab{position:absolute;top:16px;font-size:18px;font-weight:800;padding:4px 12px;border-radius:10px;opacity:0}
.swcard .lab.l{left:16px;border:3px solid var(--red);color:var(--red)}
.swcard .lab.r{right:16px;border:3px solid #1d8f5e;color:#1d8f5e}

/* Textos largos */
textarea{width:100%;min-height:120px;font:inherit;font-size:17px;padding:12px;border-radius:12px;border:2px solid #9fb4bf;color:var(--paperInk);background:#fff}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:12px;min-height:48px}
.check input{width:28px;height:28px;flex:none;margin-top:2px}
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:var(--gold);color:#2A1C00;font-weight:800;padding:12px 20px;border-radius:14px;z-index:60;box-shadow:var(--sh)}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.1);font-size:14px}
input[type=range]{width:100%;height:44px;accent-color:var(--tq)}
.svgbox svg{width:100%;height:auto;display:block}
.timeline{position:relative}

@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes beat{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.anim .fx-pop{animation:pop .4s ease-out}
.anim .fx-float{animation:floaty 4s ease-in-out infinite}
.anim .fx-in{animation:fadein .45s ease-out}
.anim .cilia{transform-box:fill-box;transform-origin:center;animation:cil 1.2s ease-in-out infinite}
@keyframes cil{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
body:not(.anim) *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:700px){h1{font-size:25px}.xpbar{width:70px}.card{height:310px}#top .ttl{font-size:15px}}

</style>
</head>
<body class="anim">
<header id="top"></header>

<script>
/* ===== DATOS DE LA MISIÓN 1 · LOS INVISIBLES ===== */
/* Fuente única: apuntes y presentación de la profesora (Tema 4). */

const MISSION = {
  id: 'bio-t4-m1',
  title: 'Misión 1 · Los invisibles',
  subtitle: 'Tema 4 · Microorganismos y formas acelulares — El mundo microbiano y los microorganismos eucariotas'
};

const BADGES = [
  { id: 'zoom', icon: '🔬', name: 'Primer zoom', desc: 'Has visto la cápsula completa.' },
  { id: 'coleccion', icon: '🃏', name: 'Coleccionista', desc: 'Has girado todas las cartas del mazo.' },
  { id: 'memory', icon: '🧩', name: 'Memoria celular', desc: 'Has completado una partida de Memory.' },
  { id: 'duelo', icon: '⚔️', name: 'Duelista', desc: 'Has ganado un duelo con 6 aciertos o más de 8.' },
  { id: 'nivel3', icon: '🧠', name: 'Aplicadora', desc: 'Has superado el nivel 3 del quiz.' },
  { id: 'clasif', icon: '🧫', name: 'Ojo de microscopio', desc: 'Clasificador sin fallos.' },
  { id: 'plasmo', icon: '🦟', name: 'Cazadora de vectores', desc: 'Has completado el ciclo de <i>Plasmodium</i>.' },
  { id: 'nucleos', icon: '🔀', name: 'Dos núcleos', desc: 'Has completado la conjugación de <i>Paramecium</i>.' },
  { id: 'laguna', icon: '🌿', name: 'Guardiana de la laguna', desc: 'Has completado «Laguna verde».' },
  { id: 'hongos', icon: '🍞', name: 'Micóloga', desc: 'Has completado «Levadura o moho».' },
  { id: 'mitos', icon: '🧪', name: 'Rompemitos', desc: '12 aciertos o más en «¿Mito o ciencia?».' },
  { id: 'jefe', icon: '👑', name: 'Jefe derrotado', desc: 'Has completado el jefe final.' }
];

/* Niveles del mapa (orden fijo del prompt) */
const LEVELS = [
  { id: 'capsula', icon: '🎬', name: 'Cápsula', desc: 'La historia del mundo invisible (≈4 min)' },
  { id: 'cartas', icon: '🃏', name: 'Cartas', desc: 'Estudiar · Memory · Duelo' },
  { id: 'quiz', icon: '❓', name: 'Quiz', desc: 'Recordar · Comprender · Aplicar' },
  { id: 'juegos', icon: '🎮', name: 'Juegos', desc: 'Cinco retos del bloque' },
  { id: 'mito', icon: '↔️', name: '¿Mito o ciencia?', desc: 'Desliza y razona' },
  { id: 'jefe', icon: '👑', name: 'Jefe final', desc: 'Una situación nueva, formato PAU' },
  { id: 'actividades', icon: '📝', name: 'Actividades de clase', desc: 'Pistas para las preguntas 1–5 y 30' },
  { id: 'cierre', icon: '🏁', name: 'Cierre', desc: 'Resumen, «Ya sé…» y repaso' }
];

/* ===== CARTAS ===== */
/* type: concepto | organismo | estructura | proceso | hito | error */
/* rar: c (común) | r (rara) | e (épica) */
const CARDS = [
  // Conceptos
  { id:'microorganismo', name:'Microorganismo', type:'concepto', rar:'e', art:'micro',
    def:'Ser vivo tan pequeño que normalmente no puede observarse a simple vista y requiere instrumentos de aumento para su estudio. Describe un tamaño y un modo de estudio, no un único grupo evolutivo.',
    ex:'Bacterias, protozoos, algas microscópicas y levaduras.',
    nc:'Bacteria: las bacterias son solo un tipo de microorganismo; también hay microorganismos eucariotas.',
    ref:'Apuntes p. 1 · Diap. 4' },
  { id:'acelulares', name:'Formas acelulares', type:'concepto', rar:'r', art:'virus',
    def:'Virus, viroides y priones. No forman células; dependen de células o proteínas del hospedador para propagarse.',
    ex:'Los virus se estudian en microbiología, aunque no son células.',
    nc:'Microorganismos celulares (bacterias, protozoos, algas, hongos).',
    ref:'Apuntes p. 2 · Diap. 5' },
  { id:'protozoo', name:'Protozoo', type:'concepto', rar:'e', art:'protozoo',
    def:'Organismo eucariota, generalmente unicelular y heterótrofo. La mayoría carece de pared celular. Es una agrupación didáctica de distintos protistas: no todos pertenecen al mismo grupo evolutivo.',
    ex:'<i>Paramecium</i>, amebas, <i>Trypanosoma</i>, <i>Plasmodium</i>.',
    nc:'Alga microscópica: las algas son fotosintéticas.',
    ref:'Apuntes p. 2 · Diap. 9' },
  { id:'formasvida', name:'Vida libre, simbionte, parásito', type:'concepto', rar:'c', art:'tres',
    def:'Tres formas de vida de los protozoos: viven libremente en el agua o en ambientes húmedos, establecen asociaciones estrechas con otros organismos o viven a expensas de un hospedador.',
    ex:'Ameba (vida libre) · protozoos del intestino de las termitas (simbiontes) · <i>Plasmodium</i> (parásito).',
    nc:'Simbionte no significa parásito.',
    ref:'Apuntes p. 2 · Diap. 9' },
  { id:'mutualismo', name:'Mutualismo', type:'concepto', rar:'c', art:'mutual',
    def:'Relación en la que ambas especies se benefician.',
    ex:'Termitas y protozoos flagelados de su intestino: los protozoos digieren la celulosa y la termita les ofrece refugio sin oxígeno y alimento.',
    nc:'Parasitismo: uno se beneficia a costa del otro.',
    ref:'Apuntes p. 15 · Diap. 10' },
  { id:'vector', name:'Vector biológico', type:'concepto', rar:'e', art:'vector',
    def:'Organismo que transmite el agente causal entre hospedadores. No «produce» la enfermedad por sí mismo.',
    ex:'La hembra de <i>Anopheles</i> transmite <i>Plasmodium</i>; la mosca tse-tsé transmite <i>Trypanosoma brucei</i>.',
    nc:'Agente causal: el que causa la enfermedad es el protozoo.',
    ref:'Apuntes p. 4–5 · Diap. 16' },
  { id:'hospedador', name:'Hospedador', type:'concepto', rar:'c', art:'host',
    def:'Organismo en el que vive un parásito y del que obtiene nutrientes.',
    ex:'<i>Plasmodium</i> necesita dos hospedadores: el ser humano y la hembra del mosquito <i>Anopheles</i>.',
    nc:'Vector: el mosquito es a la vez hospedador y vector.',
    ref:'Apuntes p. 3–4' },
  { id:'fitoplancton', name:'Fitoplancton', type:'concepto', rar:'r', art:'plancton',
    def:'Conjunto de algas microscópicas, muchas unicelulares, que actúan como productores primarios y contribuyen a la producción de oxígeno.',
    ex:'Diatomeas y dinoflagelados.',
    nc:'Algas pluricelulares (como la mayoría de las rodofitas).',
    ref:'Apuntes p. 6 · Diap. 20' },
  { id:'productor', name:'Productor primario', type:'concepto', rar:'c', art:'sol',
    def:'Organismo que fabrica materia orgánica mediante fotosíntesis. Las algas del fitoplancton actúan como productores primarios.',
    ex:'Las diatomeas, importantes productores primarios del plancton.',
    nc:'Descomponedor: transforma materia orgánica muerta.',
    ref:'Apuntes p. 6' },
  { id:'mixotrofo', name:'Mixótrofo', type:'concepto', rar:'r', art:'mixo',
    def:'Organismo que puede combinar fotosíntesis y nutrición heterótrofa.',
    ex:'<i>Euglena</i> (euglenofitas).',
    nc:'Protozoo: los protozoos son heterótrofos.',
    ref:'Apuntes p. 6 · Diap. 21' },

/* ===== VOZ (Web Speech API) + subtítulos ===== */
let VOICE=null, speakToken=0;
function pickVoice(){
  try{
    const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    VOICE = vs.find(v=>v.lang==='es-ES') || vs.find(v=>/^es[-_]ES/i.test(v.lang)) || vs.find(v=>/^es/i.test(v.lang)) || null;
  }catch(e){ VOICE=null; }
}
function voiceName(){ return VOICE ? `${VOICE.name} (${VOICE.lang})` : 'ninguna voz en español: solo subtítulos'; }
if(window.speechSynthesis){ pickVoice(); try{ speechSynthesis.onvoiceschanged=pickVoice; }catch(e){} }

function splitSentences(t){ return plain(t).replace(/\s+/g,' ').match(/[^.!?¿¡]+[.!?]*|[¿¡][^?!]+[?!]/g)?.map(s=>s.trim()).filter(Boolean) || [plain(t)]; }
function showSub(t){ let s=$('#subs'); if(!s){ s=h('<div id="subs" role="status" aria-live="polite"></div>'); document.body.appendChild(s);} s.textContent=t; s.classList.remove('hide'); }
function hideSub(){ const s=$('#subs'); if(s) s.classList.add('hide'); }
function stopSpeech(){ speakToken++; try{ window.speechSynthesis && speechSynthesis.cancel(); }catch(e){} hideSub(); $$('.listen.on').forEach(b=>b.classList.remove('on')); }
/* Lee una lista de frases mostrando subtítulos; onEnd al acabar */
function speak(text, onEnd, btn){
  stopSpeech(); const my=++speakToken;
  const parts = Array.isArray(text) ? text.flatMap(splitSentences) : splitSentences(text);
  if(btn) btn.classList.add('on');
  let i=0;
  const next=()=>{
    if(my!==speakToken) return;
    if(i>=parts.length){ hideSub(); if(btn) btn.classList.remove('on'); onEnd && onEnd(); return; }
    const p=parts[i++]; showSub(p);
    const useVoice = S.voice && window.speechSynthesis && VOICE;
    if(useVoice){
      try{
        const u=new SpeechSynthesisUtterance(p); u.lang=VOICE.lang; u.voice=VOICE; u.rate=0.98;
        let finished=false; const fin=()=>{ if(finished) return; finished=true; next(); };
        u.onend=fin; u.onerror=fin;
        setTimeout(fin, 1500 + p.length*110); // seguridad si el navegador no avisa
        speechSynthesis.speak(u);
      }catch(e){ setTimeout(next, 900 + p.length*55); }
    } else setTimeout(next, 900 + p.length*55);
  };
  next();
}
function listenBtn(getText, label='🔊 Escuchar'){
  const b=h(`<button class="btn small listen" aria-label="Escuchar la explicación">${label}</button>`);
  b.onclick=(e)=>{ e.stopPropagation(); if(b.classList.contains('on')){ stopSpeech(); return; } speak(getText(), null, b); };
  return b;
}

/* ===== ARRASTRAR Y SOLTAR (Pointer Events) con alternativa de tocar ===== */
/* chips: .chip[data-id]; zonas: [data-zone]. onDrop(chipEl, zoneEl) */
function DnD(root, onDrop){
  if(root._dndAbort) root._dndAbort.abort();
  const ac=new AbortController(); root._dndAbort=ac; const sig={signal:ac.signal};
  let selected=null;
  const clearSel=()=>{ if(selected) selected.classList.remove('sel'); selected=null; };
  root.addEventListener('click', e=>{
    const z=e.target.closest('[data-zone]');
    const c=e.target.closest('.chip');
    if(c && root.contains(c) && !c.dataset.locked){
      if(selected===c){ clearSel(); return; }
      clearSel(); selected=c; c.classList.add('sel'); return;
    }
    if(z && selected){ const s=selected; clearSel(); onDrop(s,z); }
  }, sig);
  root.addEventListener('pointerdown', e=>{
    const c=e.target.closest('.chip'); if(!c || c.dataset.locked || !root.contains(c)) return;
    const sx=e.clientX, sy=e.clientY; let ghost=null, over=null, moved=false;
    const r=c.getBoundingClientRect(); const ox=sx-r.left, oy=sy-r.top;
    const move=ev=>{
      const dx=ev.clientX-sx, dy=ev.clientY-sy;
      if(!moved && Math.hypot(dx,dy)<8) return;
      if(!moved){ moved=true; ghost=c.cloneNode(true); ghost.classList.add('dragging'); ghost.style.width=r.width+'px'; document.body.appendChild(ghost); c.style.opacity='.35'; }
      ev.preventDefault();
      ghost.style.left=(ev.clientX-ox)+'px'; ghost.style.top=(ev.clientY-oy)+'px';
      const el=document.elementFromPoint(ev.clientX, ev.clientY); const z=el && el.closest('[data-zone]');
      if(over && over!==z) over.classList.remove('over');
      over = (z && root.contains(z)) ? z : null; if(over) over.classList.add('over');
    };
    const up=()=>{
      window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); window.removeEventListener('pointercancel',up);
      if(!moved) return; // fue un toque: lo gestiona el click
      ghost && ghost.remove(); c.style.opacity='';
      if(over){ over.classList.remove('over'); clearSel(); onDrop(c, over); }
      c.dataset.justDragged='1'; setTimeout(()=>delete c.dataset.justDragged, 50);
    };
    window.addEventListener('pointermove',move,{passive:false}); window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up);
  }, sig);
  // Evita que un arrastre dispare también el clic de selección
  root.addEventListener('click', e=>{ const c=e.target.closest('.chip'); if(c && c.dataset.justDragged){ e.stopImmediatePropagation(); } }, {capture:true, signal:ac.signal});
}

ROUTES.capsula = (idx=0) => {

  m.innerHTML = header('🎬','Cápsula audiovisual', `Parte ${idx+1} de ${SCENES.length} · ${sc.title}`) + `

    <div class="panel mt" id="script" aria-live="polite"></div>
    <div id="stopq"></div>`;
  let i=-1;
  const frame=(k)=>{ $('#stage').innerHTML = sceneVisual(sc.id, k); };
  const showLine=(k)=>{ $('#script').innerHTML = sc.lines.slice(0,k+1).map(l=>`<p class="fx-in">${l.replace(/(Paramecium|Plasmodium|Trypanosoma|Anopheles|Euglena|Penicillium)/g,'<i>$1</i>')}</p>`).join(''); };
  const end=()=>{ $('#play').disabled=true; $('#stepb').disabled=true; showStop(); };
  const advance=(auto)=>{
    i++; if(i>=sc.lines.length){ end(); return; }
    frame(i); showLine(i);
    if(auto) speak(sc.lines[i], ()=>advance(true)); else stopSpeech();
  };
  $('#play').onclick=()=>{ if(i>=sc.lines.length-1){ i=-1; } i--; i=Math.max(-1,i); advance(true); };

    const st=sc.stop, box=h(`<div class="panel stop mt fx-in"><h3>⏸️ Para y piensa</h3><p>${st.q}</p><div id="sopts"></div><div id="sexp"></div></div>`);

    st.o.forEach((o,k)=>{ const b=h(`<button class="opt">${o}</button>`); b.onclick=()=>{

      ex.appendChild(listenBtn(()=>st.q+' '+st.e)); $('#sexp').appendChild(ex);
      if(!S.scenes[sc.id]){ S.scenes[sc.id]=true; save(); addXP(k===st.a?15:8,'Cápsula'); }
      const nx = idx<SCENES.length-1 ? h(`<button class="btn primary mt">Siguiente parte ▶</button>`) : h(`<button class="btn gold mt">🏁 Terminar cápsula</button>`);
      nx.onclick=()=>{ if(idx<SCENES.length-1) go('capsula', idx+1); else { markDone('capsula'); badge('zoom'); go('home'); } };
      $('#sexp').appendChild(nx);
    }; $('#sopts').appendChild(b); });
  }
};
const GENERA=['Paramecium','Euglena','Plasmodium','Penicillium','Anopheles','Trypanosoma'];

function sceneVisual(id,k){

  }
  if(id==='tiempo'){
    const pts=[[4540,'Tierra'],[3700,'¿indicios? (discutido)'],[3500,'vida microbiana'],[2400,'Gran Oxidación'],[1800,'primeros eucariotas']];

      ${pts.map((p,j)=> show.indexOf(j)<=k ? `<g class="fx-pop"><circle cx="${X(p[0])}" cy="240" r="${j===1?9:13}" fill="${j===1?'none':'#f2b134'}" stroke="#f2b134" stroke-width="3" ${j===1?'stroke-dasharray="4 3"':''}/>
        <text x="${X(p[0])}" y="${j%2?300:200}" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">≈ ${p[0].toLocaleString('es-ES')} Ma</text>
        <text x="${X(p[0])}" y="${j%2?326:174}" text-anchor="middle" fill="#a9c3cc" font-size="17">${p[1]}</text></g>`:'').join('')}
      <text x="400" y="420" text-anchor="middle" fill="#a9c3cc" font-size="16">Línea a escala aproximada · millones de años (Ma)</text></svg>`;
  }
  if(id==='mover'){
    const P=[['05-ameba.webp','Ameboides: pseudópodos'],['04-paramecium.webp','Ciliados: cilios'],['06-trypanosoma.webp','Flagelados: flagelos'],[null,'Apicomplejos: complejo apical']];
    return `<div style="position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#06131c">${P.map((p,j)=>`<div style="position:relative;opacity:${j<=k-1||k>=4?1:.18};transition:opacity .4s">${p[0]?`<img src="${p[0]}" alt="" style="width:100%;height:100%;object-fit:cover">`:`<div style="height:100%;display:flex;align-items:center;justify-content:center">${ART.apical}</div>`}<div style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.75);padding:6px;font-size:15px;text-align:center">${p[1]}</div></div>`).join('')}</div>`;
  }
  if(id==='nucleos'){
    const one=(x,y,o={})=>paramecioSVG(x,y,1.6,o);
    let body='';
    if(k<=1) body=one(400,225)+(k===1?lbl(330,140,'macronúcleo')+lbl(470,330,'micronúcleo'):'');
    else if(k===2) body=`<g transform="rotate(-6 400 170)">${one(400,170)}</g><g transform="rotate(6 400 285)">${one(400,285)}</g><path d="M400 200 v50" stroke="#f2b134" stroke-width="6" stroke-dasharray="6 5"/>${lbl(400,440,'intercambio de material genético')}`;
    else if(k===3) body=`<g transform="rotate(-6 400 170)">${one(400,170,{macroFade:true})}</g><g transform="rotate(6 400 285)">${one(400,285,{macroFade:true})}</g>${lbl(400,440,'el macronúcleo antiguo desaparece')}`;
    else body=`${one(230,225)}${one(570,225)}${lbl(400,440,'2 → 2: no es reproducción')}`;
    return `${V} aria-label="Conjugación de Paramecium"><rect width="800" height="450" fill="#0c3446"/>${body}</svg>`;
  }

  }
  return '';
}

function cardsMemory(z){

  const tiles=shuffle(chosen.flatMap(c=>[{id:c.id,k:'n',t:`<b>${c.name}</b>`},{id:c.id,k:'d',t:plain(c.def).split('. ')[0]+'.'}]));
  z.innerHTML=`<p>Empareja cada carta con su definición. Toca dos fichas.</p><div class="mem" id="mem"></div><div id="mfb"></div>`;
  let first=null, found=0, tries=0;
  tiles.forEach((t,i)=>{ const b=h(`<button class="mtile hidden" data-i="${i}"><span>${t.t}</span></button>`);
    b.onclick=()=>{ if(b.classList.contains('ok')||b===first) return;
      b.classList.remove('hidden'); b.classList.add('sel');
      if(!first){ first=b; return; }
      tries++; const a=tiles[first.dataset.i], c=tiles[i];

function cardsDuel(z){

    `<div class="grid">${[1,2,3].map(n=>{ const un = n===1 || (best[n-1]||0)>=6 || S.free;
      return `<button class="tile ${(best[n]||0)>=6?'done':''} ${un?'':'locked'}" onclick="${un?`go('quiz',${n})`:`toast('🔒 Consigue 6/8 en el nivel ${n-1}')`}"><span class="ic">${['🧠','💡','🔬'][n-1]}</span><span class="nm">Nivel ${n} · ${['Recordar','Comprender','Aplicar a casos nuevos'][n-1]}</span><span class="ds">Mejor resultado: ${best[n]??'—'}/8</span></button>`; }).join('')}</div>`;

  }

    if(k>=qs.length){
      S.quizBest[lv]=Math.max(S.quizBest[lv]||0, ok); save(); addXP(ok*4,`Quiz nivel ${lv}`);

       <div class="row" style="justify-content:center"><button class="btn" onclick="go('quiz',${lv})">Repetir</button>${ok>=6&&lv<3?`<button class="btn primary" onclick="go('quiz',${lv+1})">Nivel ${lv+1} ▶</button>`:''}<button class="btn" onclick="go('quiz')">Niveles</button></div></div>`;
      return;
    }
    const q=qs[k]; const opts=shuffle(q.o.map((o,j)=>({t:o[0],c:o[1],e:o[2],j})));
    m.innerHTML = header('❓',`Nivel ${lv} · Pregunta ${k+1}/${qs.length}`) + `<div class="paper fx-in"><h3>${q.q}</h3><div id="qo"></div><div id="qfb"></div><div class="ref">${q.ref}</div></div>`;
    opts.forEach(o=>{ const b=h(`<button class="opt">${o.t}</button>`); b.onclick=()=>{
      $$('#qo .opt').forEach((x,ix)=>{ x.disabled=true; const oo=opts[ix]; if(oo.c) x.classList.add('good'); else if(x===b) x.classList.add('badx'); x.insertAdjacentHTML('beforeend',`<span class="why"><span class="mark">${oo.c?'✔':'✘'}</span>${oo.e}</span>`); });
      if(o.c){ ok++; pass('quiz'+lv,String(q.i)); } else fail('quiz'+lv,String(q.i));
      const fb=h(`<div class="feedback ${o.c?'good':'bad'}"><b>${o.c?'✔ Correcto.':'✘ Incorrecto.'}</b></div>`);
      fb.appendChild(listenBtn(()=>plain(q.q)+' Respuesta correcta: '+plain(opts.find(x=>x.c).t)+'. '+plain(opts.find(x=>x.c).e)));
      const nb=h('<button class="btn primary">Siguiente ▶</button>'); nb.style.marginLeft='8px'; nb.onclick=()=>{k++;draw();}; fb.appendChild(nb);
      $('#qfb').appendChild(fb);

/* ===== ¿MITO O CIENCIA? ===== */
ROUTES.mito = () => {
  const m=$('#main'); const fl=failedIds('mito');
  const deck=[...shuffle(MYTHS.map((x,i)=>({...x,i})).filter(x=>fl.includes(String(x.i)))), ...shuffle(MYTHS.map((x,i)=>({...x,i})).filter(x=>!fl.includes(String(x.i))))];
  let k=0, ok=0;
  m.innerHTML = header('↔️','¿Mito o ciencia?','Desliza a la IZQUIERDA si es un mito y a la DERECHA si es ciencia. También puedes usar los botones.') +
   `<div class="swipewrap" id="sw"></div><div class="row mt" style="justify-content:center"><button class="btn" id="bm">⬅️ Mito</button><button class="btn" id="bc">Ciencia ➡️</button></div><div id="mfb" style="max-width:640px;margin:0 auto"></div>`;
  const answer=(saysMyth)=>{
    const c=deck[k]; if(!c || $('#sw').dataset.lock) return; $('#sw').dataset.lock=1;
    const good = saysMyth===c.m; if(good){ok++; pass('mito',String(c.i));} else fail('mito',String(c.i));
    $('#mfb').innerHTML=`<div class="feedback ${good?'good':'bad'}"><b>${good?'✔ Correcto':'✘ Fallo'}: es ${c.m?'un MITO':'CIENCIA'}.</b> ${c.e} <span class="ref">${c.ref}</span></div>`;
    const nb=h('<button class="btn primary mt">Siguiente ▶</button>'); nb.onclick=()=>{ delete $('#sw').dataset.lock; k++; $('#mfb').innerHTML=''; draw(); }; $('#mfb').firstChild.appendChild(document.createElement('br')); $('#mfb').firstChild.appendChild(nb);
    $('#mfb').firstChild.appendChild(listenBtn(()=>plain(c.t)+'. Es '+(c.m?'un mito. ':'ciencia. ')+plain(c.e)));
  };
  const draw=()=>{
    const sw=$('#sw'); sw.innerHTML='';
    if(k>=deck.length){ addXP(ok*2,'Mito o ciencia'); if(ok>=12) badge('mitos'); markDone('mito');
      sw.innerHTML=`<div class="swcard">${ok}/${deck.length} aciertos</div>`; $('#mfb').innerHTML=`<div class="row mt" style="justify-content:center"><button class="btn" onclick="go('mito')">Repetir</button><button class="btn primary" onclick="go('home')">Mapa</button></div>`; return; }
    const c=deck[k]; const card=h(`<div class="swcard fx-pop" aria-live="polite"><span class="lab l">MITO</span><span class="lab r">CIENCIA</span><div>${c.t}<div class="ref mt">${k+1}/${deck.length}</div></div></div>`);
    sw.appendChild(card);
    let sx=null, dx=0;
    card.addEventListener('pointerdown',e=>{ if(sw.dataset.lock) return; sx=e.clientX; card.setPointerCapture(e.pointerId); });
    card.addEventListener('pointermove',e=>{ if(sx===null) return; dx=e.clientX-sx; card.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`; $('.lab.l',card).style.opacity=Math.min(1,-dx/100); $('.lab.r',card).style.opacity=Math.min(1,dx/100); });
    const end=()=>{ if(sx===null) return; sx=null; if(Math.abs(dx)>90){ answer(dx<0); card.style.transform=`translateX(${dx<0?-600:600}px)`; card.style.opacity='0'; } else { card.style.transform=''; $$('.lab',card).forEach(l=>l.style.opacity=0); } dx=0; };
    card.addEventListener('pointerup',end); card.addEventListener('pointercancel',end);
  };
  $('#bm').onclick=()=>answer(true); $('#bc').onclick=()=>answer(false);
  draw();
};

   ${box('Paramecium: conjugación',['Macronúcleo → metabolismo habitual','Micronúcleo → procesos sexuales','Intercambio genético; nuevo núcleo diploide','El macronúcleo antiguo desaparece','2 → 2: NO es reproducción'],'#6b3fa0')}

function gClasif(){
  const items=[
    {id:'paramecium',g:'protozoo',mv:'ciliado',why:'Eucariota heterótrofo con cilios.'},
    {id:'ameba',g:'protozoo',mv:'ameboide',why:'Eucariota heterótrofo con pseudópodos.'},
    {id:'trypanosoma',g:'protozoo',mv:'flagelado',why:'Eucariota heterótrofo con flagelo.'},
    {id:'plasmodium',g:'protozoo',mv:'apicomplejo',why:'Parásito con complejo apical.'},
    {id:'diatomea',g:'alga',why:'Fotosintética, pared de sílice.'},
    {id:'dinoflagelado',g:'alga',why:'Fotosintético, dos flagelos.'},
    {id:'euglena',g:'alga',why:'Euglenofita: fotosintética y mixótrofa.'},
    {id:'levadura',g:'hongo',why:'Hongo unicelular, gemación.'},
    {id:'penicillium',g:'hongo',why:'Moho: hifas y micelio.'},
    {t:'Bacteria',g:'procariota',why:'Procariota: sin núcleo.'},
    {t:'Arquea',g:'procariota',why:'Procariota: sin núcleo.'},
    {t:'Virus',g:'acelular',why:'No forma células.'}
  ];
  const Z=[['protozoo','🦠 Protozoos'],['alga','🌿 Algas microscópicas'],['hongo','🍄 Hongos microscópicos'],['procariota','⚪ Procariotas'],['acelular','⬡ Acelulares']];
  const m=$('#main'); let errors=0, placed=0;
  m.innerHTML = header('🧫','Clasificador de microscopio','Fase 1: arrastra cada microorganismo a su grupo.') + `<div class="panel"><div class="chips" id="pool"></div></div><div class="zones mt" id="zs">${Z.map(z=>`<div class="zone" data-zone="${z[0]}"><h4>${z[1]}</h4><div class="chips"></div></div>`).join('')}</div><div id="fb"></div>` + backGames();
  shuffle(items).forEach((it,i)=>{ const c=it.id?cardById(it.id):null; const ch=h(`<div class="chip" tabindex="0" data-i="${items.indexOf(it)}">${c&&c.img?`<img src="${c.img}" alt="">`:''}<span>${c?c.name:it.t}</span></div>`); $('#pool').appendChild(ch); });
  DnD(m, (ch,z)=>{
    const it=items[+ch.dataset.i];
    if(it.g===z.dataset.zone){ ch.dataset.locked=1; ch.classList.add('ok'); $('.chips',z).appendChild(ch); placed++; $('#fb').innerHTML=`<div class="feedback good">✔ ${it.why}</div>`;
      if(placed===items.length) phase2(); }
    else { errors++; ch.classList.add('no'); setTimeout(()=>ch.classList.remove('no'),600); $('#fb').innerHTML=`<div class="feedback bad">✘ Ahí no. Pista: ${it.g==='alga'?'¿hace fotosíntesis?':it.g==='protozoo'?'¿es eucariota heterótrofo y no tiene pared de quitina?':it.g==='hongo'?'¿se nutre por absorción y tiene pared de quitina?':it.g==='procariota'?'¿tiene núcleo?':'¿es una célula?'}</div>`; if(it.id) fail('carta',it.id); }
  });
  function phase2(){
    const P=items.filter(i=>i.mv); const MZ=[['ameboide','Ameboides (pseudópodos)'],['ciliado','Ciliados (cilios)'],['flagelado','Flagelados (flagelos)'],['apicomplejo','Apicomplejos (complejo apical)']];
    m.innerHTML = header('🧫','Clasificador · Fase 2','Ahora clasifica los protozoos por su forma de desplazamiento.') + `<div class="panel"><div class="chips" id="pool"></div></div><div class="zones mt">${MZ.map(z=>`<div class="zone" data-zone="${z[0]}"><h4>${z[1]}</h4><div class="chips"></div></div>`).join('')}</div><div id="fb"></div>` + backGames();
    let ok2=0;
    shuffle(P).forEach(it=>{ const c=cardById(it.id); $('#pool').appendChild(h(`<div class="chip" data-i="${items.indexOf(it)}"><img src="${c.img}" alt=""><span>${c.name}</span></div>`)); });
    DnD(m,(ch,z)=>{ const it=items[+ch.dataset.i];
      if(it.mv===z.dataset.zone){ ch.dataset.locked=1; ch.classList.add('ok'); $('.chips',z).appendChild(ch); ok2++;
        if(ok2===P.length){ $('#fb').innerHTML=`<div class="feedback good">🏆 ¡Clasificador completado! Errores: ${errors}. <span class="ref">Apuntes p. 2–3</span></div>`; gameDone('clasif', errors===0); if(errors>0) toast('Repite sin fallos para ganar la insignia «Ojo de microscopio»'); } }
      else { errors++; ch.classList.add('no'); setTimeout(()=>ch.classList.remove('no'),600); $('#fb').innerHTML=`<div class="feedback bad">✘ Fíjate en cómo se desplaza (o si no tiene estructuras locomotoras).</div>`; }
    });
  }
}

/* --- b) Ciclo de Plasmodium --- */
const PSTEPS=[
  ['Una hembra de <i>Anopheles</i> infectada pica e introduce esporozoitos.','mosquito→persona'],
  ['Los esporozoitos llegan al hígado e invaden los hepatocitos; se multiplican y originan merozoitos.','persona'],
  ['Los merozoitos pasan a la sangre e invaden los glóbulos rojos.','persona'],
  ['Dentro de los glóbulos rojos se multiplican; su rotura periódica se relaciona con la fiebre.','persona'],
  ['Algunos se transforman en gametocitos masculinos y femeninos.','persona'],
  ['Otro mosquito pica a la persona infectada e ingiere los gametocitos.','persona→mosquito'],
  ['En el mosquito se forman gametos que se fusionan y originan un cigoto.','mosquito'],
  ['A partir del cigoto se forman esporozoitos que migran a las glándulas salivales.','mosquito'],
  ['El mosquito pica a otra persona e inocula esporozoitos: el ciclo vuelve a empezar.','mosquito→persona']
];
function gPlasmo(){
  const m=$('#main'); let errs=0, placed=0;
  m.innerHTML = header('🦟','Ciclo de <i>Plasmodium</i>','Fase 1: arrastra cada paso a su número (1–9).') + `
   <div class="row" style="align-items:flex-start;gap:16px">
    <div class="panel" style="flex:1 1 300px"><h3>Pasos desordenados</h3><div class="chips" id="pool" style="flex-direction:column"></div></div>
    <div class="panel" style="flex:1 1 360px;background:linear-gradient(180deg,rgba(142,27,44,.4),rgba(22,52,74,.9))"><h3>Ciclo</h3>${PSTEPS.map((s,i)=>`<div class="slot" data-zone="${i}"><span class="num">${i+1}</span><span class="pill">${s[1]}</span></div>`).join('')}</div>
   </div><div id="fb"></div><div id="ph2"></div>` + backGames();
  shuffle(PSTEPS.map((s,i)=>i)).forEach(i=>$('#pool').appendChild(h(`<div class="chip" data-i="${i}" style="width:100%"><span>${PSTEPS[i][0]}</span></div>`)));
  DnD(m,(ch,z)=>{
    if(!z.classList.contains('slot')) return;
    if(+ch.dataset.i===+z.dataset.zone){ ch.dataset.locked=1; ch.classList.add('ok'); ch.style.width=''; z.appendChild(ch); z.removeAttribute('data-zone'); placed++; $('#fb').innerHTML='';
      if(placed===9) phase2(); }
    else { errs++; ch.classList.add('no'); setTimeout(()=>ch.classList.remove('no'),600);
      $('#fb').innerHTML=`<div class="feedback bad">✘ No va en el ${+z.dataset.zone+1}. Pista: sigue el orden mosquito → hígado → glóbulos rojos → gametocitos → mosquito.</div>`; }
  });
  function phase2(){
    $('#fb').innerHTML=`<div class="feedback good">✔ ¡Ciclo completo! Apuntes p. 5</div>`;
    const F=[['esporozoito','Forma que el mosquito inocula'],['merozoito','Forma producida en el hígado que invade los glóbulos rojos'],['gametocito','Forma sexual que ingiere otro mosquito']];
    $('#ph2').innerHTML=`<div class="panel mt"><h3>Fase 2 · Coloca cada forma del parásito</h3><div class="chips" id="fp">${shuffle(F).map(f=>`<div class="chip" data-f="${f[0]}"><span>${cardById(f[0]).name}</span></div>`).join('')}</div>
      <div class="zones mt">${F.map(f=>`<div class="zone" data-zone="f-${f[0]}"><h4>${f[1]}</h4><div class="chips"></div></div>`).join('')}</div><div id="fb2"></div></div>`;
    let ok=0;
    DnD($('#ph2'),(ch,z)=>{ if(('f-'+ch.dataset.f)===z.dataset.zone){ ch.dataset.locked=1; ch.classList.add('ok'); $('.chips',z).appendChild(ch); ok++; if(ok===3) phase3(); } else { errs++; ch.classList.add('no'); setTimeout(()=>ch.classList.remove('no'),600); fail('carta',ch.dataset.f); } });
  }
  function phase3(){
    $('#ph2').insertAdjacentHTML('beforeend',`<div class="panel mt fx-in"><h3>Fase 3 · ¿Y si eliminamos el mosquito?</h3><p>Pulsa el botón y observa qué pasos se apagan. Después responde.</p>
      <button class="btn gold" id="kill">🦟❌ Eliminar <i>Anopheles</i></button><div id="q3"></div></div>`);
    $('#kill').onclick=()=>{
      $$('.slot').forEach((s,i)=>{ const dep=[0,5,6,7,8].includes(i); s.style.opacity=dep?.3:1; s.style.borderColor=dep?'#FF6B6B':'#3DDC97'; s.insertAdjacentHTML('beforeend', `<b style="margin-left:auto">${dep?'⛔ interrumpido':'✅ sigue en quien ya está infectado'}</b>`); });
      $('#kill').disabled=true;
      $('#q3').innerHTML=`<p class="mt"><b>¿Qué queda interrumpido al eliminar el mosquito?</b></p>`;
      const opts=shuffle([['La fase sexual y la transmisión a nuevas personas',true],['La multiplicación en los glóbulos rojos de quien ya está infectado',false],['Los episodios de fiebre de las personas ya infectadas',false]]);
      opts.forEach(o=>{ const b=h(`<button class="opt">${o[0]}</button>`); b.onclick=()=>{ $$('#q3 .opt').forEach(x=>x.disabled=true); b.classList.add(o[1]?'good':'badx');
        $('#q3').appendChild(h(`<div class="feedback ${o[1]?'good':'bad'}">${o[1]?'✔':'✘'} La fase sexual ocurre en el mosquito y él es el vector que lleva el parásito a otras personas. En quien ya está infectado, la multiplicación en los glóbulos rojos (pasos 3–5) no depende del mosquito. <span class="ref">Apuntes p. 5 · Diap. 18</span></div>`));
        gameDone('plasmo'); }; $('#q3').appendChild(b); });
    };
  }
}

/* --- c) Los dos núcleos --- */
const CSTEPS=['Dos paramecios compatibles se unen temporalmente.','Sus micronúcleos experimentan varias divisiones.','Intercambian material genético entre sí.','El material recibido se fusiona con el propio: se forma un nuevo núcleo diploide.','El macronúcleo antiguo se desorganiza y desaparece.','A partir del nuevo núcleo se originan nuevos micronúcleos y macronúcleos.'];
function gNucleos(){
  const m=$('#main'); let errs=0, placed=0;
  m.innerHTML = header('🔀','Los dos núcleos','Fase 1: ordena la conjugación de <i>Paramecium</i>. La animación avanza con cada acierto.') + `
   <div class="paper svgbox" id="anim" style="padding:6px;background:#0c3446"></div>
   <div class="row mt" style="align-items:flex-start;gap:16px"><div class="panel" style="flex:1 1 300px"><div class="chips" id="pool" style="flex-direction:column"></div></div>
   <div class="panel" style="flex:1 1 300px">${CSTEPS.map((s,i)=>`<div class="slot" data-zone="${i}"><span class="num">${i+1}</span></div>`).join('')}</div></div><div id="fb"></div><div id="ph2"></div>` + backGames();
  const frame=(k)=>{ const one=(x,y,o)=>paramecioSVG(x,y,1.3,o); let b='';
    if(k<0) b=one(250,150)+one(550,150);
    else if(k<=2) b=`<g transform="rotate(-6 400 110)">${one(400,110)}</g><g transform="rotate(6 400 200)">${one(400,200)}</g>${k>=2?'<path d="M400 130 v40" stroke="#f2b134" stroke-width="6" stroke-dasharray="6 5"/>':''}`;
    else if(k<=4) b=`<g transform="rotate(-6 400 110)">${one(400,110,{macroFade:k>=4})}</g><g transform="rotate(6 400 200)">${one(400,200,{macroFade:k>=4})}</g>`;
    else b=one(250,150)+one(550,150);
    $('#anim').innerHTML=`<svg viewBox="0 0 800 300" role="img" aria-label="Animación de la conjugación">${b}<text x="400" y="290" text-anchor="middle" fill="#fff" font-size="20">${k<0?'Antes: 2 paramecios':k>=5?'Después: los mismos 2 paramecios':'Paso '+(k+1)}</text></svg>`; };
  frame(-1);
  shuffle(CSTEPS.map((s,i)=>i)).forEach(i=>$('#pool').appendChild(h(`<div class="chip" data-i="${i}" style="width:100%"><span>${CSTEPS[i]}</span></div>`)));
  DnD(m,(ch,z)=>{ if(!z.classList.contains('slot')) return;
    if(+ch.dataset.i===+z.dataset.zone){ ch.dataset.locked=1; ch.classList.add('ok'); ch.style.width=''; z.appendChild(ch); z.removeAttribute('data-zone'); placed++; frame(+ch.dataset.i); $('#fb').innerHTML=''; if(placed===6) phase2(); }
    else { errs++; ch.classList.add('no'); setTimeout(()=>ch.classList.remove('no'),600); $('#fb').innerHTML='<div class="feedback bad">✘ Ese no es el paso '+(+z.dataset.zone+1)+'. Piensa: primero se unen, luego actúan los micronúcleos y al final cambian los núcleos.</div>'; }
  });
  function phase2(){
    const Q=[
      ['¿Qué núcleo se divide e intercambia material genético?',['Micronúcleo','Macronúcleo'],0,'El micronúcleo contiene la información genética que participa en los procesos sexuales.'],
      ['¿Qué núcleo se desorganiza y desaparece?',['El macronúcleo antiguo','El micronúcleo'],0,'El material de los micronúcleos no pasa al macronúcleo antiguo: este desaparece.'],
      ['Al terminar, ¿cuántos individuos hay?',['Cuatro','Los mismos dos'],1,'La conjugación no produce inmediatamente nuevos individuos: genera variabilidad. Después cada uno puede reproducirse por bipartición.']];
    let k=0;
    const draw=()=>{ if(k>=Q.length){ $('#ph2').innerHTML=`<div class="feedback good mt">🏆 ¡Conjugación dominada! <span class="ref">Apuntes p. 3 · Diap. 13</span></div>`; gameDone('nucleos'); return; }
      const q=Q[k]; $('#ph2').innerHTML=`<div class="panel mt"><h3>Fase 2 · ${k+1}/3</h3><p><b>${q[0]}</b></p><div id="o"></div></div>`;
      q[1].forEach((t,j)=>{ const b=h(`<button class="opt">${t}</button>`); b.onclick=()=>{ $$('#o .opt').forEach(x=>x.disabled=true); b.classList.add(j===q[2]?'good':'badx'); if(j!==q[2]) fail('carta','conjugacion');
        const f=h(`<div class="feedback ${j===q[2]?'good':'bad'}">${j===q[2]?'✔':'✘'} ${q[3]}</div>`); const n=h('<button class="btn primary">Siguiente ▶</button>'); n.style.marginLeft='8px'; n.onclick=()=>{k++;draw();}; f.appendChild(n); $('#o').appendChild(f); }; $('#o').appendChild(b); }); };
    draw();
  }
}

/* --- d) Laguna verde --- */
function gLaguna(){
  const m=$('#main');
  m.innerHTML = header('🌿','Laguna verde','Modelo cualitativo, sin cifras. Mueve el deslizador de nutrientes y observa.') + `
   <div class="stage" id="lag"><img src="16-laguna.webp" alt="Laguna con el agua verde" id="limg"><div class="cap" id="lcap"></div></div>
   <label class="mt" style="display:block"><b>Aporte de nutrientes:</b> <span id="lval">bajo</span><input type="range" min="0" max="2" step="1" value="0" id="nut" aria-label="Aporte de nutrientes"></label>
   <div id="lq"></div>` + backGames();
  const set=(v)=>{ const t=['bajo','medio','alto'][v]; $('#lval').textContent=t;
    $('#limg').style.filter=['saturate(.25) brightness(.9) hue-rotate(30deg)','saturate(.7)','saturate(1.25)'][v];
    $('#lcap').textContent=['Agua clara: pocos microorganismos fotosintéticos.','Aumentan los microorganismos fotosintéticos.','Proliferación brusca: el agua cambia de color.'][v];
    if(v===2 && !$('#lq').innerHTML) q1(); };
  $('#nut').oninput=e=>set(+e.target.value); set(0);
  function q1(){
    const G=[['Diatomeas',true],['Dinoflagelados',true],['Euglenofitas',true],['Clorofitas',true],['Levaduras',false],['Amebas',false]];
    $('#lq').innerHTML=`<div class="panel mt fx-in"><h3>1 · ¿Qué grupos estudiados podrían estar implicados?</h3><p class="sub">Marca todos los que sean microorganismos fotosintéticos y comprueba.</p>
      ${G.map((g,i)=>`<label class="check"><input type="checkbox" data-i="${i}"> <span>${g[0]}</span></label>`).join('')}<button class="btn primary" id="c1">Comprobar</button><div id="f1"></div></div>`;
    $('#c1').onclick=()=>{ const ok=$$('#lq input').every(x=>x.checked===G[+x.dataset.i][1]);
      $('#f1').innerHTML=`<div class="feedback ${ok?'good':'bad'}">${ok?'✔':'✘'} Las algas microscópicas son eucariotas fotosintéticas: diatomeas, dinoflagelados, euglenofitas y clorofitas pueden proliferar. Levaduras y amebas son heterótrofas. <span class="ref">Apuntes p. 6</span></div>`;
      if(ok) q2(); };
  }
  function q2(){
    if($('#q2')) return;
    const O=[['Unicelular flagelada','euglena'],['Pared celular de sílice','diatomea'],['La pared está formada por dos valvas','diatomea'],['Puede combinar fotosíntesis y nutrición heterótrofa','euglena']];
    $('#lq').insertAdjacentHTML('beforeend',`<div class="panel mt fx-in" id="q2"><h3>2 · ¿Qué observaciones distinguen una euglenofita de una diatomea?</h3><div class="chips" id="op">${shuffle(O).map(o=>`<div class="chip" data-g="${o[1]}">${o[0]}</div>`).join('')}</div>
      <div class="zones mt"><div class="zone" data-zone="euglena"><h4><img src="12-euglena.webp" alt="" style="width:60px;border-radius:8px;vertical-align:middle"> Euglenofita</h4><div class="chips"></div></div><div class="zone" data-zone="diatomea"><h4><img src="10-diatomea.webp" alt="" style="width:60px;border-radius:8px;vertical-align:middle"> Diatomea</h4><div class="chips"></div></div></div><div id="f2"></div></div>`);
    let n=0;
    DnD($('#q2'),(ch,z)=>{ if(ch.dataset.g===z.dataset.zone){ ch.dataset.locked=1; ch.classList.add('ok'); $('.chips',z).appendChild(ch); n++; if(n===O.length) q3(); } else { ch.classList.add('no'); setTimeout(()=>ch.classList.remove('no'),600); } });
  }
  function q3(){
    $('#lq').insertAdjacentHTML('beforeend',`<div class="panel mt fx-in"><h3>3 · ¿Todas las proliferaciones tienen el mismo efecto?</h3><div id="o3"></div></div>`);
    [['Sí: todas son tóxicas',false],['No: depende de la especie; solo determinadas especies producen toxinas',true]].forEach(o=>{ const b=h(`<button class="opt">${o[0]}</button>`); b.onclick=()=>{ $$('#o3 .opt').forEach(x=>x.disabled=true); b.classList.add(o[1]?'good':'badx');
      $('#o3').appendChild(h(`<div class="feedback ${o[1]?'good':'bad'}">${o[1]?'✔':'✘'} En las mareas rojas, solo determinadas especies de dinoflagelados producen toxinas; no todo cambio de color es tóxico. <span class="ref">Apuntes p. 6 · Diap. 22</span></div>`)); gameDone('laguna'); }; $('#o3').appendChild(b); });
  }
}

/* --- e) Levadura o moho --- */
function gHongos(){
  const m=$('#main');
  const A=[['Células aisladas, ovaladas','lev'],['Se reproduce frecuentemente por gemación','lev'],['Vive en medios ricos en azúcares; algunas fermentan','lev'],['Pan y bebidas fermentadas','lev'],['Filamentos llamados hifas','moho'],['El conjunto de hifas forma un micelio','moho'],['Antibióticos (<i>Penicillium</i>)','moho'],['Deterioro de alimentos (manchas sobre la fruta)','moho'],['Pared celular de quitina','ambos'],['Heterótrofos por absorción','ambos']];
  m.innerHTML = header('🍞','Levadura o moho','Arrastra cada rasgo a la levadura, al moho o a «ambos».') + `
   <div class="panel"><div class="chips" id="pool">${shuffle(A).map(a=>`<div class="chip" data-g="${a[1]}"><span>${a[0]}</span></div>`).join('')}</div></div>
   <div class="zones mt">
     <div class="zone" data-zone="lev"><h4><img src="13-levaduras.webp" alt="" style="width:70px;border-radius:8px;vertical-align:middle"> Levadura</h4><div class="chips"></div></div>
     <div class="zone" data-zone="ambos"><h4>🍄 Ambos (todos los hongos)</h4><div class="chips"></div></div>
     <div class="zone" data-zone="moho"><h4><img src="14-penicillium.webp" alt="" style="width:70px;border-radius:8px;vertical-align:middle"> Moho</h4><div class="chips"></div></div>
   </div><div id="fb"></div>` + backGames();
  let n=0;
  DnD(m,(ch,z)=>{ if(ch.dataset.g===z.dataset.zone){ ch.dataset.locked=1; ch.classList.add('ok'); $('.chips',z).appendChild(ch); n++;
      if(n===A.length){ $('#fb').innerHTML=`<div class="feedback good">🏆 ¡Completado! Levaduras (unicelulares) y mohos (filamentosos) son hongos: comparten la nutrición por absorción y la pared de quitina. <span class="ref">Apuntes p. 7 · Diap. 23</span></div>`; gameDone('hongos'); } }
    else { ch.classList.add('no'); setTimeout(()=>ch.classList.remove('no'),600); $('#fb').innerHTML=`<div class="feedback bad">✘ Pista: ¿es un rasgo de un hongo unicelular, de uno filamentoso o de todos los hongos?</div>`; } });
}
